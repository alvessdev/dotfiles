###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywresizeactiveords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$secondaryMod = CTRL_L
$anotherMod = SHIFT_L
$msg = hyprctl dispatch layoutmsg

source = binds/windows.conf
source = binds/workspaces.conf
source = binds/zoom.conf
source = binds/fnKeys.conf

# Other configs here

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, t, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, U, pseudo, # dwindle

#custom
bindr = $mainMod, d, exec, $menu -show drun
bind = $mainMod, f, fullscreen, 1
bind = SUPER_SHIFT, f, fullscreen, 3 
bind = $mainMod, b, exec, $terminal btop
bind = $mainMod, BACKSPACE, exec, killall waybar || hypr-waybar
bind = $mainMod, p, exec, hyprpicker -a
bind = $mainMod, period, exec, $menu -modi clipboard:$scripts/cliphist-rofi-img.sh -show clipboard -show-icons
bind = ,Print, exec, flameshot gui
bind = $mainMod, n, exec, swaync-client -t -sw
bind = $mainMod $secondaryMod, p, exec, sleep 2 && hyprctl dispatch dpms off
bind = $mainMod $secondaryMod, g, exec, $scripts/gamemode.sh
bind = $mainMod, a, exec, $scripts/configWorkspace.sh
bind = $mainMod $anotherMod, e, exec, hyprctl dispatch exit

# layout
bind = $mainMod, y, exec, killall rofi || $scripts/changeLayout.sh 
# teste de submap
bind = $mainMod $secondaryMod, v, submap, virtualMachine
submap = virtualMachine

bind = $mainMod, escape, submap, reset

submap = reset

binds {
	 
	 workspace_back_and_forth = true
}
