[audio]
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    end = [
        "tray",
        "notifications",
        "group:g2",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "control-center",
        "session"
    ]
    start = [ "workspaces", "active_window" ]

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "network", "network_rx", "network_tx" ]
        opacity = 1.0
        padding = 6.0

[location]
address = ""

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
position_vertical = "bottom_right"

[[plugins.source]]
enabled = false
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
enabled = false
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[shell]
offline_mode = true
password_style = "random"
polkit_agent = true
show_location = false

    [shell.launcher.dmenu.entry.layout]
    command = """printf 'Dwindle
Scrolling
Master
Monocle'"""
    exec = "$HOME/.config/hypr/scripts/change-layout.sh {selection}"
    global = false
    glyph = "terminal"
    label = "Change layout"
    prefix = "layout"

    [shell.panel]
    control_center_position = "center"

    [shell.screenshot]
    confirm_region = true

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/arcus/wallpapers"

    [wallpaper.default]
    path = "/home/arcus/wallpapers/maze_original.png"

    [wallpaper.last]
    path = "/home/arcus/wallpapers/maze_original.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/arcus/wallpapers/maze_original.png"

[widget.clock]
anchor = true

[widget.media]
album_art_only = true
hide_when_no_media = true
