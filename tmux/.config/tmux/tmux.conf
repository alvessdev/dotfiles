set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g set-clipboard on

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

unbind r
bind-key r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

unbind %
unbind '"'
bind v split-window -h -c "#{pane-current_path}"
bind s split-window -v -c "#{pane-current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -L

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -L

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# vim copying
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Tokyonight Moon theme from tony-btw
bg="#222436"
fg="#c8d3f5"
cyan="#86e1fc"
black="#1b1d2b"
gray="#3a3f5a"
magenta="#c099ff"
pink="#ff757f"
red="#ff757f"
green="#c3e88d"
yellow="#ffc777"
blue="#82aaff"
orange="#ff9e64"
black4="#445a73"

# Status bar
set -g status "on"
set -g status-bg "${bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -g message-style "fg=${cyan},bg=${gray},fill=${bg}"
set -g message-command-style "fg=${cyan},bg=${gray},align=centre"

# Panes
set -g pane-border-style "fg=${gray}"
set -g pane-active-border-style "fg=${blue}"

# Windows
set -g window-status-activity-style "fg=${fg},bg=${bg},none"
set -g window-status-separator ""
set -g window-status-style "fg=${fg},bg=${bg},none"

# Statusline - current window
set -g window-status-current-format "#[fg=${blue},bg=${bg}] #I: #[fg=${magenta},bg=${bg}](✓) #[fg=${cyan},bg=${bg}]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=${magenta},bg=${bg}]"

# Statusline - other windows
set -g window-status-format "#[fg=${blue},bg=${bg}] #I: #[fg=${fg},bg=${bg}]#W"

# Statusline - right side
set -g status-right "#[fg=${blue},bg=${bg},nobold,nounderscore,noitalics]#[fg=${bg},bg=${blue},nobold,nounderscore,noitalics] #[fg=${fg},bg=${gray}] #W #{?client_prefix,#[fg=${magenta}],#[fg=${cyan}]}#[bg=${gray}]#{?client_prefix,#[bg=${magenta}],#[bg=${cyan}]}#[fg=${bg}] #[fg=${fg},bg=${gray}] #S "

# Statusline - left side (empty)
set -g status-left ""

# Modes
set -g clock-mode-colour "${blue}"
set -g mode-style "fg=${blue} bg=${black4} bold"
