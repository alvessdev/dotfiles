###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywresizeactiveords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$secondaryMod = CTRL_L
$anotherMod = ALT_L

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal --hold nitch
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, Z, togglesplit, # dwindle

#custom
bindr = $mainMod, SUPER_L, exec, $menu -show drun
bind = $mainMod, f, fullscreen, 1
bind = SUPER_SHIFT, f, fullscreen, 3 
bind = $mainMod, b, exec, $terminal btop
bind = $mainMod, BACKSPACE, exec, killall $bar || $bar
bind = $mainMod $secondaryMod, p, exec, hyprpicker -a
bind = $mainMod, period, exec, $menu -modi clipboard:~/.config/rofi/cliphist-rofi-img -show clipboard -show-icons
bind = ,Print, exec, flameshot gui
bind = $mainMod, n, exec, swaync-client -t -sw
bind = $mainMod $secondaryMod $anotherMod, escape, exec, sleep 1 && hyprctl dispatch dpms off
bind = $mainMod $secondaryMod, g, exec, /home/kaua/.config/hypr/scripts/gamemode.sh
bind = $mainMod, a, exec, killall pavucontrol || pavucontrol

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move as janelas
bind = $mainMod $secondaryMod, left, swapwindow, l
bind = $mainMod $secondaryMod, right, swapwindow, r
bind = $mainMod $secondaryMod, up, swapwindow, u
bind = $mainMod $secondaryMod, down, swapwindow, d

bind = $mainMod $secondaryMod, h, swapwindow, l
bind = $mainMod $secondaryMod, l, swapwindow, r
bind = $mainMod $secondaryMod, k, swapwindow, u
bind = $mainMod $secondaryMod, j, swapwindow, d

# Altera o tamanho da janela
binde = $mainMod $anotherMod, left, resizeactive, -20 0
binde = $mainMod $anotherMod, right, resizeactive, 20 0
binde = $mainMod $anotherMod, up, resizeactive, 0 -20
binde = $mainMod $anotherMod, down, resizeactive, 0 20

binde = $mainMod $anotherMod, h, resizeactive, -20 0
binde = $mainMod $anotherMod, l, resizeactive, 20 0
binde = $mainMod $anotherMod, k, resizeactive, 0 -20
binde = $mainMod $anotherMod, j, resizeactive, 0 20

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, g, workspace, 11

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, g, movetoworkspace, 11

#zoom
$mod = $mainMod $secondaryMod
bind = $mod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.5')
bind = $mod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.5) | if . < 1 then 1 else . end')

binde = $mod, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.5')
binde = $mod, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.5) | if . < 1 then 1 else . end')
binde = $mod, KP_ADD, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.5')
binde = $mod, KP_SUBTRACT, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.5) | if . < 1 then 1 else . end')

bind = $mod SHIFT, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mod SHIFT, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mod SHIFT, minus, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mod SHIFT, KP_SUBTRACT, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mod SHIFT, 0, exec, hyprctl -q keyword cursor:zoom_factor 1

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume 5
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, swayosd-client --playerctl next
bindl = , XF86AudioPause, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPrev, exec, swayosd-client --playerctl previous


# teste de submap
bind = $mainMod $secondaryMod, v, submap, virtualMachine
submap = virtualMachine

bind = $mainMod, escape, submap, reset

submap = reset
